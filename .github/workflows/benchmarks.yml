name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      ground:
        description: SymPy coefficient backend
        type: choice
        options: [flint, python]
        default: flint
      suite:
        description: Input sizes
        type: choice
        options: [standard, smoke]
        default: standard

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMPY_GROUND_TYPES: ${{ inputs.ground }}
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/install_backends.py --published --profile real
      - run: python -m pip install .
      - run: python benchmarks/run.py --suite ${{ inputs.suite }} --real --repeat 5 --output benchmark.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-${{ inputs.ground }}-${{ inputs.suite }}
          path: benchmark.json
